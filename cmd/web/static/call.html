<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>take-back</title>
<link rel="icon" type="image/svg+xml" href="/logo-mark.svg?v=dev">
<link rel="stylesheet" href="/call.css?v=dev">
<style>
  :root {
    color-scheme: dark;
    --bg:        #0b0d11;
    --panel:     #11141b;
    --surface-2: #1e2431;
    --border:    #232936;
    --border-soft: #1a1f29;
    --text:      #e8eaf0;
    --muted:     #8a93a6;
    --dim:       #5a6273;
    --accent:    #5b8cff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 0 1rem; height: 52px; display: flex; align-items: center; gap: .6rem;
    border-bottom: 1px solid var(--border-soft); background: var(--panel); flex: none;
  }
  header h1 { font-size: .95rem; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header .sub { color: var(--dim); font-size: .78rem; }
  header a { color: var(--accent); font-size: .8rem; text-decoration: none; margin-left: auto; }
  header a:hover { text-decoration: underline; }

  /* The lobby is a reading-width column; the call itself gets the whole window. */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 1rem; }
  main.lobby { max-width: 1100px; width: 100%; margin: 0 auto; padding: 1.25rem; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; flex: none;
  }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
  input {
    width: 100%; padding: .5rem .7rem; border-radius: 10px; border: 1px solid var(--border);
    background: #0d1016; color: var(--text); font-size: .95rem;
  }
  input::placeholder { color: var(--dim); }
  input:focus { border-color: #2f4a8f; outline: none; }
  button {
    padding: .5rem .85rem; border-radius: 10px; border: 1px solid transparent; font-size: .875rem;
    cursor: pointer; background: var(--accent); color: #fff; font-weight: 550; font-family: inherit;
  }
  button:hover { background: #6f9bff; }
  button.secondary { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; }
  .row > div { flex: 1; min-width: 180px; }
  .status { font-size: .8rem; color: var(--dim); }
  #callHost { flex: 1; min-height: 0; display: flex; }
</style>
</head>
<body>
<header>
  <h1>take-back</h1>
  <span class="sub">webrtc nat-passthrough prototype</span>
  <a href="/">← back to chat</a>
</header>

<main id="main" class="lobby">

  <!-- Step 1: nickname -->
  <section id="nickStep" class="card">
    <label for="nick">Enter a nickname to get started</label>
    <div class="row">
      <div><input id="nick" placeholder="e.g. river" autocomplete="off"></div>
      <button id="nickBtn">Continue</button>
    </div>
  </section>

  <!-- Step 2: host or join -->
  <section id="lobbyStep" class="card hidden">
    <div style="margin-bottom:1rem;">
      <span class="status">Hi <b id="nickLabel"></b> — start or join a call.</span>
    </div>
    <div class="row">
      <div><button id="hostBtn">Host a new call</button></div>
      <div>
        <label for="joinCode">Join with a call code</label>
        <input id="joinCode" placeholder="ABCD12" autocomplete="off" style="text-transform:uppercase;">
      </div>
      <div style="flex:0;"><button id="joinBtn" class="secondary">Join</button></div>
    </div>
  </section>

  <!-- Step 3: the call itself, rendered by TBCall -->
  <div id="callHost" class="hidden"></div>
</main>

<script src="/call-core.js?v=dev"></script>
<script>
// This page is now just the lobby around TBCall: pick a nickname, host or join,
// and hand the room to the shared engine (which is the same code the chat page
// embeds in its call panel).
const $ = (id) => document.getElementById(id);
let nick = "";

$("nickBtn").onclick = () => {
  const v = $("nick").value.trim();
  if (!v) return;
  nick = v;
  $("nickLabel").textContent = nick;
  $("nickStep").classList.add("hidden");
  $("lobbyStep").classList.remove("hidden");
};
$("nick").addEventListener("keydown", (e) => { if (e.key === "Enter") $("nickBtn").click(); });

function randomCode() {
  const alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += alphabet[Math.floor(Math.random() * alphabet.length)];
  return s;
}
$("hostBtn").onclick = () => startCall(randomCode());
$("joinBtn").onclick = () => {
  const c = $("joinCode").value.trim().toUpperCase();
  if (c) startCall(c);
};

async function startCall(code) {
  // Put the room (and nick) in the URL so a page reload rejoins the same call
  // instead of dropping back to the lobby. autostart() reads these on load;
  // leaving clears them again.
  const u = new URL(location);
  u.searchParams.set("room", code);
  u.searchParams.set("nick", nick);
  history.replaceState(null, "", u);

  $("lobbyStep").classList.add("hidden");
  $("nickStep").classList.add("hidden");
  $("main").classList.remove("lobby"); // let the call use the whole window
  $("callHost").classList.remove("hidden");

  await TBCall.mount($("callHost"), {
    nick,
    room: code,
    // Leaving navigates to a room-less URL, so a reload lands on the lobby
    // rather than rejoining the call we just left.
    onLeave: () => { location.href = location.pathname; },
  });
}

// Bootstrap: opened as call.html?room=CODE&nick=NAME (e.g. from a chat link)?
// Skip the nickname/lobby steps and join straight away.
(function autostart() {
  const params = new URLSearchParams(location.search);
  const room = params.get("room"), who = params.get("nick");
  if (room && who) {
    nick = who;
    startCall(room.toUpperCase());
  }
})();
</script>
</body>
</html>
