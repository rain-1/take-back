# nginx vhost for take-back.
# Origin sits behind Cloudflare (proxied). The browser always talks HTTPS to
# Cloudflare (required for getUserMedia/Notifications). This server answers both
# :80 and :443 so the Cloudflare->origin leg can be either "Flexible" (HTTP :80)
# or "Full (strict)" (HTTPS :443 with the Cloudflare Origin cert below). Prefer
# Full (strict). See deploy/CLOUDFLARE-TLS.md for the dashboard steps.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    # Cloudflare->origin TLS (SSL mode Full (strict)). Cert = Cloudflare Origin
    # CA cert; installed out-of-band, never committed. See deploy/CLOUDFLARE-TLS.md.
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/ssl/takeback/origin.pem;
    ssl_certificate_key /etc/ssl/takeback/private.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_name takeback.chain-of-thought.org;

    # --- Cloudflare origin hardening (added 2026-07-19, reworked 2026-08-31) ---
    # Only accept connections proxied by Cloudflare, so nobody can reach the
    # origin directly and forge the CF-Connecting-IP header the app trusts.
    #
    # This was `allow <CF range>; deny all;` until the realip module arrived
    # globally in conf.d/cloudflare-realip.conf (for transcript rate limiting).
    # realip rewrites $remote_addr to the end user BEFORE allow/deny runs, so
    # the allowlist started testing visitors against Cloudflare's ranges and
    # 403'd every real user. The ranges now live in nginx-cloudflare-peer.conf
    # (installed as conf.d/takeback-cf-peer.conf) and are matched against
    # $realip_remote_addr — the original TCP peer, which realip preserves — so
    # both features work at once.
    if ($cf_peer = 0) {
        return 403;
    }

    # Attachment uploads: images, video, audio, documents. The app caps a single
    # file at 95 MB (api.MaxUploadBytes) because Cloudflare's free plan refuses
    # request bodies over 100 MB at the edge; this is the headroom for the
    # multipart envelope around it.
    client_max_body_size 100m;

    # Serve the debug APK for easy on-device install (optional convenience).
    # no-store keeps Cloudflare from caching it — otherwise a freshly deployed
    # APK is masked by the edge-cached old one until its TTL expires.
    location = /take-back.apk {
        alias /opt/takeback/take-back.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename=take-back.apk';
        add_header Cache-Control 'no-store';
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # WebSocket upgrade for /ws and /api/events (proxied through cmd/web).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep long-lived signaling/events sockets alive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
