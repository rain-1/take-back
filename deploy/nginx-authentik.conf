# nginx vhost for Authentik — the identity provider take-back signs in through.
#
# Authentik runs as containers bound to 127.0.0.1:9000 (see
# deploy/authentik/README.md); this is the only way in from outside.
#
# $connection_upgrade is defined by nginx-takeback.conf, which is also in
# sites-enabled — both files share one http context, so redefining the map here
# would be a duplicate and nginx would refuse to start.

server {
    listen 80;
    listen [::]:80;

    server_name auth.chain-of-thought.org;

    # Same origin hardening as take-back: only Cloudflare may reach this, so
    # nobody can bypass the edge and forge the client-IP header the rate
    # limiting trusts. $cf_peer comes from conf.d/takeback-cf-peer.conf and
    # tests the original TCP peer, not the realip-rewritten one.
    if ($cf_peer = 0) {
        return 403;
    }

    # Profile pictures and flow backgrounds are the largest things uploaded here.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS and talks HTTP to this origin, so the
        # scheme nginx sees is not the one the browser used. Authentik builds
        # its OIDC issuer and redirect URLs from this header: without it every
        # URL it hands out would be http://, and take-back would refuse the
        # issuer as a mismatch.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Authentik's flow UI and outpost connections are WebSockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A sign-in can sit waiting for someone to touch a security key.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
