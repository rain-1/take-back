# Which requests reached this origin through Cloudflare.
#
# The takeback vhost used to enforce this with `allow <CF range>; deny all;`,
# which tests $remote_addr. That worked until conf.d/cloudflare-realip.conf was
# added (globally, for the transcripts rate limiting): realip rewrites
# $remote_addr to the END USER's address before allow/deny runs, so the
# allowlist began testing visitors against Cloudflare's ranges and denied
# everyone. The vhost's own comment predicted exactly this.
#
# $realip_remote_addr is the original TCP peer, preserved by the realip module
# after it rewrites $remote_addr — which is precisely the thing the allowlist
# needs to test. It is empty when realip did not rewrite (a direct connection
# from a non-Cloudflare address), and geo maps that to the default, so an
# attacker hitting the origin IP directly still fails closed.
geo $realip_remote_addr $cf_peer {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
