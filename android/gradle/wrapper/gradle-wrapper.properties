distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
# SHA-256 of the distribution above, from services.gradle.org/distributions/gradle-8.7-bin.zip.sha256.
# HTTPS authenticates the host, not the bytes: without this pin the wrapper will
# execute whatever that URL serves, so a compromised mirror or a redirected
# download becomes arbitrary code in every build. Regenerate when bumping Gradle.
distributionSha256Sum=544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
