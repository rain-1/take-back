<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="take-back">
  <title>take-back — bloom</title>
  <!--
    The bloom on its own, without the bubble. Use it where the container is
    already a shape: a round avatar, a launcher icon, a favicon at 16px where
    the bubble's tail would turn to mush.
  -->
