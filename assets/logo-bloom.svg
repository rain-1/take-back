      <path d="M 0 -13 C 6.5 -22, 7.6 -31, 0 -38 C -7.6 -31, -6.5 -22, 0 -13 Z" transform="rotate(120)"/>
      <path d="M 0 -13 C 6.5 -22, 7.6 -31, 0 -38 C -7.6 -31, -6.5 -22, 0 -13 Z" transform="rotate(150)"/>
      <path d="M 0 -13 C 6.5 -22, 7.6 -31, 0 -38 C -7.6 -31, -6.5 -22, 0 -13 Z" transform="rotate(180)"/>
